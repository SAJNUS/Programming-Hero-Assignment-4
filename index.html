<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Job Application Tracker</h1>
        </header>

        <section class="dashboard">
            <div class="stat-card">
                <p class="stat-label">Total</p>
                <p class="stat-value total" id="total-count">0</p>
            </div>
            <div class="stat-card">
                <p class="stat-label">Interview</p>
                <p class="stat-value interview">0</p>
            </div>
            <div class="stat-card">
                <p class="stat-label">Rejected</p>
                <p class="stat-value rejected">0</p>
            </div>
        </section>

        <section class="jobs-section">
            <div class="jobs-header">
                <h2>Available Jobs</h2>
                <p class="job-count" id="job-count">0 jobs</p>
            </div>

            <div class="filter-tabs">
                <button class="tab-btn active">All</button>
                <button class="tab-btn">Interview</button>
                <button class="tab-btn">Rejected</button>
            </div>

            <div class="jobs-grid" id="job-container">
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
